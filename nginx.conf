user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    server {
        listen 80;
        server_name _;
        root /var/www/html;
        index index.html;

        # DNS interno de Docker; permite iniciar Nginx antes del backend
        # y resolver de nuevo su dirección si el contenedor se recrea.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend galeno.backend:9080;

        location ^~ /galeno/ {
            proxy_pass http://$backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_redirect http://galeno.backend:9080/ /;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_cache off;
            add_header Cache-Control "no-store" always;
        }

        location = /js/control/default_service.js {
            add_header Cache-Control "no-store" always;
        }

        location = /serviceWorker.js {
            add_header Cache-Control "no-store" always;
        }

        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-cache" always;
        }
    }
}
