<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GalenoFE - Clínica</title>
    <link rel="stylesheet" href="Recursos/estilos/principal.css" />
    <link rel="stylesheet" href="Recursos/estilos/login.css" />
    <link rel="stylesheet" href="Recursos/estilos/resumen.css" />
    <link rel="stylesheet" href="Recursos/estilos/charts.css" />
    <link rel="stylesheet" href="Recursos/estilos/consultas.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="Recursos/estilos/paciente.css" />
    <link rel="stylesheet" href="Recursos/estilos/calendar.css" />
    <link rel="stylesheet" href="Recursos/estilos/dataTable.css" />
  </head>
  <body>
    <div class="contenedor-app">
      <!-- Menú Lateral -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <img
            class="sidebar-logo"
            src="Recursos/imagenes/logo-menu-marino.png"
            alt="GalenoSV · Tu salud, nuestra prioridad"
          />
        </div>
        <nav id="menu-lateral">
          <!-- data-route coincide con las rutas de router.js -->
          <a href="#" data-route="/dashboard" class="activo">Inicio</a>
          <a href="#" data-route="/personas">Gestión de Personas</a>
          <a href="#" data-route="/consultas">Agenda Médica</a>
          <a href="#" data-route="/procedimientos">Atención y Procedimientos</a>
          <a href="#" data-route="/laboratorio">Laboratorio</a>

          <!-- Botón enviado al fondo -->
          <a href="#" data-route="/configuracion" class="btn-config"
            >Configuración</a
          >
        </nav>
      </aside>

      <!-- Contenido Dinámico -->
      <main class="contenido-principal">
        <header class="topbar">
          <button
            id="btn-menu-movil"
            class="menu-movil"
            aria-label="Abrir menú"
          >
            ☰
          </button>
          <h1 id="titulo-pagina">Resumen</h1>
          <instalador-app></instalador-app>
          <div class="usuario">
            <div class="avatar" id="usuario-avatar">--</div>
            <div class="usuario-datos">
              <strong id="usuario-nombre">Cargando…</strong>
              <small id="usuario-detalle"></small>
            </div>
            <button class="btn-salir" id="btn-salir" type="button">
              Cerrar sesión
            </button>
          </div>
        </header>

        <!-- Aquí se renderizará el contenido -->
        <div id="app-root"></div>

        <footer class="pie">Galenos · Gestión clínica</footer>
      </main>
    </div>

    <!-- Pantalla de ingreso (la llena login.js) -->
    <div id="pantalla-login" class="pantalla-login" hidden></div>

    <!-- Script principal con parámetro para evitar caché -->
    <script src="js/main.js?v=8" type="module" defer></script>

    <script>
      if ('serviceWorker' in navigator) {
        // Una pestaña controlada por la versión anterior debe cargar los módulos nuevos.
        const teniaControlador = Boolean(navigator.serviceWorker.controller);
        let recargando = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (teniaControlador && !recargando) {
            recargando = true;
            window.location.reload();
          }
        });
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('serviceWorker.js', { updateViaCache: 'none' })
            .catch(error => console.error('No se registró el SW:', error));
        });
      }
    </script>
  </body>
</html>
